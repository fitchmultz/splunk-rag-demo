services:
  db:
    image: pgvector/pgvector:pg18
    container_name: splunkbot-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-splunkbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-splunkbot}
      POSTGRES_DB: ${POSTGRES_DB:-splunkbot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 uses PGDATA=/var/lib/postgresql/18/docker
      # Mount the parent directory to persist data correctly
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-splunkbot} -d ${POSTGRES_DB:-splunkbot}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
