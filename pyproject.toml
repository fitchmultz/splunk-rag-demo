[project]
name = "splunkbot"
version = "0.1.0"
description = "Local RAG chatbot for Splunk documentation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "pgvector>=0.4.0",
    "pymupdf>=1.25.0",
    "langchain-text-splitters>=0.3.0",
    "ollama>=0.4.0",
    "streamlit>=1.41.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "ty>=0.0.1a9",
]

[project.scripts]
splunkbot = "splunkbot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splunkbot"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.13"
